  <body>
    <main>
      <form class="form">
        <label>
          Delay (ms)
          <input class="number" type="number" name="delay" required />

        <fieldset>
          <legend>State</legend>
          <label>
            <input type="radio" name="state" value="fulfilled" required />

          </label>
          <label>
            <input type="radio" name="state" value="rejected" required />

          </label>
        </fieldset>

        <button type="submit" class="create-notification">
          Create notification
        </button>
      </form>
    </main>
