<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnackBar App</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <script type="module" src="./js/02-snackbar.js"></script>
    <main>
      <form class="form">
        <label>
          Delay (ms)
          <input class="number" type="number" name="delay" required />
        </label>

        <fieldset>
          <legend>State</legend>
          <label>
            <input type="radio" name="state" value="fulfilled" required />
            Fulfilled
          </label>
          <label>
            <input type="radio" name="state" value="rejected" required />
            Rejected
          </label>
        </fieldset>

        <button type="submit" class="create-notification">
          Create notification
        </button>
      </form>
    </main>
  </body>
</html>
